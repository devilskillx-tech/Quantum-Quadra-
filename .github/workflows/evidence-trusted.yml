name: QUADRA trusted evidence verification (operator triggered)
# Bootstrap only: workflow MUST run on a ruleset-protected default branch or a
# separately protected certification repository. Merely adding it does not
# activate independent governance and cannot authorize a production GO.
on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: 'JSON mapping of required control_ids to CI run IDs'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  verify-evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Trusted default-branch commit, not PR's head/merge commit.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepare operator-approved candidate policy
        env:
          APPROVED_POLICY_B64: ${{ secrets.QUADRA_EVIDENCE_POLICY_B64 }}
          REQUIRED_RUN_IDS: ${{ inputs.run_ids }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, pathlib
          p=os.environ.get('APPROVED_POLICY_B64','')
          if not p:
              raise SystemExit('NO-GO: no approved external evidence policy')
          root=pathlib.Path('evidence-results')
          root.mkdir(exist_ok=True)
          root.joinpath('approved-policy.json').write_bytes(base64.b64decode(p,validate=True))
          root.joinpath('run-ids.json').write_text(os.environ['REQUIRED_RUN_IDS'])
          PY
      - name: Run independently checked verifier self-tests
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8'
          python -m pytest -q tests/test_evidence_security.py tests/test_trusted_pipeline.py
      - name: Collect then independently re-query and verify GitHub evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m scripts.evidence_collect \
            --trusted-policy evidence-results/approved-policy.json \
            --run-ids evidence-results/run-ids.json \
            --output evidence-results/unverified-manifest.json
          python -m scripts.evidence_verify \
            --manifest evidence-results/unverified-manifest.json \
            --trusted-policy evidence-results/approved-policy.json \
            --output evidence-results/verification.json
      - name: Remove policy from publication artifacts
        if: always()
        run: rm -f evidence-results/approved-policy.json evidence-results/run-ids.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quadra-verified-evidence
          path: |
            evidence-results/verification.json
            evidence-results/unverified-manifest.json
          if-no-files-found: warn
