name: QUADRA release gate
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quadra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[test,api]'
      - name: Compile
        run: python -m compileall -q quantum_quadra
      - name: SQLite, API, audit and simulated failures
        run: python -m pytest -q --maxfail=1 tests/test_store.py tests/test_api.py tests/test_v74_regressions.py tests/test_sync_simulator.py tests/test_release_gate.py
      - name: Self-test
        run: python -m quantum_quadra selftest
      - name: Labeled retrieval fixture (diagnostic, not semantic validation)
        run: python -m quantum_quadra benchmark --dataset tests/retrieval_fixture.json --k 3
  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quadra_test
          POSTGRES_PASSWORD: quadra_test_password
          POSTGRES_DB: quadra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U quadra_test -d quadra_test'
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      QUADRA_TEST_PG_DSN: postgresql://quadra_test:quadra_test_password@127.0.0.1:5432/quadra_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install PostgreSQL driver and tests
        run: python -m pip install -e '.[test,postgres]'
      - name: Fail closed if integration is not configured
        run: python -c "import os,psycopg2; assert os.getenv('QUADRA_TEST_PG_DSN'); c=psycopg2.connect(os.environ['QUADRA_TEST_PG_DSN']); c.close()"
      - name: Five real PostgreSQL integration tests
        run: python -m pytest -q --maxfail=1 tests/test_postgres_integration.py
